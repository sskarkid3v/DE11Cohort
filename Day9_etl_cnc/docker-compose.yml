version: "3.9"
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - etl_net

  etl:
    build: .
    environment:
      DB_URL: ${DB_URL:-postgresql://postgres:postgres@db:5432/warehouse}
      LOOKBACK_DAYS: ${LOOKBACK_DAYS:-2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./etl:/app/etl
      - ./data:/app/data
      - ./.env:/app/.env:ro
    entrypoint: ["python","-m", "etl.main"]
    networks:
      - etl_net

volumes:
  db_data:

networks:
  etl_net:
    driver: bridge
